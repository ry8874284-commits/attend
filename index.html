<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
        }

        .attendance-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-top: 5px solid #34a853;
        }

        h2 {
            text-align: center;
            color: #34a853;
            margin-top: 0;
        }

        .date-header {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
        }

        .student-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .student-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .present {
            color: #34a853;
        }

        .absent {
            color: #ea4335;
        }

        .submit-btn {
            width: 100%;
            background-color: #34a853;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="attendance-container">

        <div class="date-header">📅 Aaj Ki Date: <span id="attDate">Loading...</span></div>
        <form id="attendanceForm">

                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"

                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_2" value="Absent"> A</label></div>
            </div>
            <div class="student-row"><span class="student-name">Disha yadav</span>
                <div class="radio-group"><label class="radio-label present"><input type="radio" name="student_3"
                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_3" value="Absent"> A</label></div>
            </div>
            <div class="student-row"><span class="student-name">adarsh yadav</span>
                <div class="radio-group"><label class="radio-label present"><input type="radio" name="student_4"
                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_4" value="Absent"> A</label></div>
            </div>
            <div class="student-row"><span class="student-name">ayush yadav</span>
                <div class="radio-group"><label class="radio-label present"><input type="radio" name="student_5"
                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_5" value="Absent"> A</label></div>
            </div>
            <div class="student-row"><span class="student-name">aryan yadav</span>
                <div class="radio-group"><label class="radio-label present"><input type="radio" name="student_6"
                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_6" value="Absent"> A</label></div>
            </div>
            <div class="student-row"><span class="student-name">hemat yadav</span>
                <div class="radio-group"><label class="radio-label present"><input type="radio" name="student_7"
                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_7" value="Absent"> A</label></div>
            </div>
            <div class="student-row"><span class="student-name">anurag yadav</span>
                <div class="radio-group"><label class="radio-label present"><input type="radio" name="student_8"
                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_8" value="Absent"> A</label></div>
            </div>
            <div class="student-row"><span class="student-name">arpit yadav</span>

                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_9" value="Absent"> A</label></div>

                            name="student_17" value="Absent"> A</label></div>
            </div>
            <div class="student-row"><span class="student-name">Ritwik Pal </span>
                <div class="radio-group"><label class="radio-label present"><input type="radio" name="student_18"
                            value="Present" checked> P</label><label class="radio-label absent"><input type="radio"
                            name="student_18" value="Absent"> A</label></div>
            </div>
            <button type="submit" class="submit-btn">📤 Attendance Submit Karein</button>
        </form>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let today = new Date();
            let day = today.getDate();
            let month = today.getMonth() + 1;
            let year = today.getFullYear();
            let formattedDate = day + '/' + month + '/' + year;
            document.getElementById('attDate').innerText = formattedDate;
        });

        document.getElementById('attendanceForm').addEventListener('submit', function (e) {
            e.preventDefault();
            let btn = document.querySelector('.submit-btn');
            btn.innerText = "⏳ Saving Attendance...";
            btn.disabled = true;

            let attendanceData = {
                date: document.getElementById('attDate').innerText,
                records: []
            };

            for (let i = 1; i <= 18; i++) {
                let status = document.querySelector(`input[name="student_${i}"]:checked`).value;
                attendanceData.records.push({ id: i, status: status });
            }

            // 🟢 AAPKA DEPLOY KIYA HUA ASLI GOOGLE APPS SCRIPT LINK
            let webAppURL = "https://script.google.com/macros/s/AKfycby9lAvcpcZK-OV_O7bYRfx4lxm_SNltejSfyV_CeuC13zSk6aNXPquIbUgOkFfbxlA1/exec";

            fetch(webAppURL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(attendanceData)
            })
                .then(() => {
                    alert("🎉 Aaj ki attendance Google Sheet me successfully save ho gayi hai!");
                    btn.innerText = "📤 Attendance Submit Karein";
                    btn.disabled = false;
                })
                .catch(err => {
                    alert("❌ Data send karne me dikkat aayi!");
                    btn.innerText = "📤 Attendance Submit Karein";
                    btn.disabled = false;
                    console.error(err);
                });
        });
    </script>
</body>

</html>
